name: Sync availability

# Reads the PUBLIC Google Sheet and rebuilds the site data on a schedule — no
# credentials, because the Sheet is shared "anyone with the link → Viewer".
# Staff just edit the Sheet; this keeps public/data/*.json in step and the
# commit it pushes triggers a redeploy. (Photos refresh via photos.yml.)

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes
  workflow_dispatch:            # …and a "Run workflow" button for on-demand syncs

permissions:
  contents: write               # to commit the refreshed data back

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Read the public Sheet and rebuild data
        env:
          SHEET_ID: ${{ vars.SHEET_ID || secrets.SHEET_ID }}   # optional; the script has a default
        run: python scripts/sync_from_google.py

      - name: Commit if anything changed
        run: |
          git config user.name  "acomodo-map bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync availability"
            git push
          fi
