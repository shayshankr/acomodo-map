<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content-Security-Policy: whitelists exactly the hosts this page uses.
     script-src has no 'unsafe-inline', so injected inline scripts cannot run. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://unpkg.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://drive.google.com https://lh3.googleusercontent.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com;
  connect-src 'self' https://nominatim.openstreetmap.org;
  base-uri 'self';
  form-action 'self';
  object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Acomodo · Live Availability Map</title>
<meta name="description" content="Acomodo — student accommodation in Dublin, Limerick and London, every property managed by us. See live availability on one map: filter by campus, price, room type and move-in date.">
<meta name="author" content="Acomodo">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Acomodo">
<meta property="og:title" content="Acomodo · Live Availability Map">
<meta property="og:description" content="Student accommodation in Dublin, Limerick and London — every property managed by us. Live availability on one map.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="./assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6324b'/%3E%3Ccircle cx='16' cy='14' r='5' fill='white'/%3E%3Cpath d='M16 27c-4-6-7-9-7-13a7 7 0 0114 0c0 4-3 7-7 13z' fill='none'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <a class="brand" id="brand-home" href="./" aria-label="Acomodo — back to all properties">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">
      <strong class="wordmark">acomodo</strong>
      <small id="brand-sub">We manage every property ourselves</small>
    </span>
  </a>

  <dl class="tally" id="tally">
    <div><dt>Beds free</dt><dd id="stat-available">—</dd></div>
    <div><dt>On hold</dt><dd id="stat-hold">—</dd></div>
    <div><dt>Properties</dt><dd id="stat-props">—</dd></div>
  </dl>

  <div class="topbar-actions">
    <span class="updated" id="updated"></span>
    <button type="button" class="ghost-btn" id="theme-toggle" aria-label="Switch colour theme">
      <span data-theme-icon>◐</span>
    </button>
  </div>
</header>

<main class="layout" id="layout">
  <section class="panel" aria-label="Filters and results">
    <div class="panel-controls">
      <label class="field search-field">
        <span class="sr-only">Search by place, area, street or eircode</span>
        <input type="search" id="q" placeholder="Search any area or place (e.g. Sandymount)" autocomplete="off">
      </label>
      <div class="place-note" id="place-note" hidden>
        <span id="place-note-text"></span>
        <button type="button" id="place-clear" aria-label="Clear place search">✕</button>
      </div>

      <div class="seg" role="group" aria-label="City">
        <button type="button" class="seg-btn is-on" data-city="all">All</button>
      </div>

      <label class="field">
        <span>Near campus</span>
        <select id="campus">
          <option value="">Anywhere</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Max rent <b id="price-out">any</b></span>
          <input type="range" id="price" min="500" max="1300" step="25" value="1300">
        </label>
        <label class="field">
          <span>Room type</span>
          <select id="roomtype"><option value="">Any</option></select>
        </label>
      </div>

      <div class="chips" role="group" aria-label="Quick filters">
        <label class="chip"><input type="checkbox" id="only-available" checked><span>Has a free bed</span></label>
        <label class="chip"><input type="checkbox" id="bills-inc"><span>Bills included</span></label>
        <label class="chip"><input type="checkbox" id="ensuite"><span>Ensuite</span></label>
        <label class="chip"><input type="checkbox" id="short-stay"><span>Short stay</span></label>
        <label class="chip chip-saved"><input type="checkbox" id="saved-only"><span>★ Saved <b id="saved-count"></b></span></label>
      </div>

      <div class="panel-meta">
        <span id="result-count">—</span>
        <div class="meta-right">
          <label class="sort-field">
            <span class="sr-only">Sort by</span>
            <select id="sort" aria-label="Sort results">
              <option value="availability">Most available</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="distance" id="sort-distance" hidden>Nearest campus</option>
            </select>
          </label>
          <button type="button" class="link-btn" id="reset">Reset</button>
        </div>
      </div>
    </div>

    <ol class="results" id="results" tabindex="-1"></ol>

    <p class="panel-foot">
      <span>Nothing in your area?</span>
      <a id="request-area" class="req-btn" href="#">Request an area</a>
    </p>
  </section>

  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="legend" id="legend">
      <span><i class="dot dot-free"></i>Free beds</span>
      <span><i class="dot dot-hold"></i>On hold</span>
      <span><i class="dot dot-full"></i>Full</span>
      <span><i class="dot dot-uni"></i>Campus</span>
    </div>
    <button type="button" class="view-toggle" id="view-toggle" aria-live="polite">List</button>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Property detail">
  <div class="drawer-inner" id="drawer-inner"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="lightbox" id="lightbox" tabindex="-1" role="dialog" aria-label="Photo viewer" hidden>
  <button type="button" class="lb-close" aria-label="Close photos">×</button>
  <button type="button" class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <img class="lb-img" src="" alt="">
  <button type="button" class="lb-nav lb-next" aria-label="Next photo">›</button>
  <div class="lb-bar">
    <span class="lb-caption"></span>
    <span class="lb-index"></span>
  </div>
</div>

<noscript><p class="noscript">This map needs JavaScript. The same availability is in the weekly PDF — email us and we will send it.</p></noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./assets/app.js" type="module"></script>
</body>
</html>
